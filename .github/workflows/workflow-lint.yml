name: Workflow Lint

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.yamllint'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.yamllint'
  workflow_dispatch: {}

jobs:
  lint-workflows:
    name: Lint workflow YAML and Actions syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint on workflow files
        run: yamllint .github/workflows/*.yml

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
