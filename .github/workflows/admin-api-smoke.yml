name: Admin API smoke test

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  smoke:
    name: Admin API smoke
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run admin API smoke test
        env:
          BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          echo "Running admin API smoke test against $BASE_URL"
          npm run test:admin-api
